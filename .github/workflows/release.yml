name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        type: string
        description: 'Release tag (e.g. v0.29.0)'
        required: true
      release_title:
        type: string
        description: 'Release title'
        required: true
        default: ''
      is_pre_release:
        type: boolean
        description: 'Set as a pre-release'
        required: true
        default: true
      branch:
        type: string
        description: 'Branch to build from'
        required: true
        default: 'master'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: "Build & Release"

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace -DskipFormatKtlint

      - name: Get version info
        run: |
          VERSION_NAME=$(grep 'versionName[[:space:]]*=' app/build.gradle.kts | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
          echo "version_name=${VERSION_NAME}" >> $GITHUB_ENV

      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::KEYSTORE secret not set. Skipping APK signing."
            echo "signed_apk=app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_ENV
          else
            echo "${KEYSTORE}" | base64 -d > apksign.keystore
            ${ANDROID_HOME}/build-tools/36.0.0/apksigner sign \
              --ks apksign.keystore \
              --ks-pass pass:"${SIGNING_STORE_PASSWORD}" \
              --ks-key-alias "${SIGNING_KEY_ALIAS}" \
              --key-pass pass:"${SIGNING_KEY_PASSWORD}" \
              "app/build/outputs/apk/release/app-release-unsigned.apk"
            mv app/build/outputs/apk/release/app-release-unsigned.apk \
               "app/build/outputs/apk/release/Tubular_v${VERSION_NAME}.apk"
            echo "signed_apk=app/build/outputs/apk/release/Tubular_v${VERSION_NAME}.apk" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="${{ inputs.release_title }}"
          if [ -z "$TITLE" ]; then
            TITLE="Tubular v${VERSION_NAME}"
          fi

          gh release create "${{ inputs.tag_name }}" \
            --title "${TITLE}" \
            --notes-file ".github/changelog.md" \
            ${{ inputs.is_pre_release == true && '--prerelease' || '' }} \
            "${signed_apk}"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: Tubular-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
        if: ${{ always() }}
