name: "Build Debug APK"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'feature/dual-subtitles'
        required: true
      skip_lint:
        description: 'Skip lint checks (faster build)'
        type: boolean
        default: false
        required: false
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'test/**'
    paths-ignore:
      - '*.md'
      - 'doc/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    name: "Build Debug APK"

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        if: ${{ !inputs.skip_lint }}
        run: ./gradlew assembleDebug lintDebug --stacktrace -DskipFormatKtlint

      - name: Build debug APK (skip lint)
        if: ${{ inputs.skip_lint }}
        run: ./gradlew assembleDebug --stacktrace -DskipFormatKtlint -x lintDebug -x runCheckstyle -x runKtlint

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName[[:space:]]*=' app/build.gradle.kts | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "branch_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "commit_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            if [ -f "$apk" ]; then
              new_name="Tubular_${{ steps.version.outputs.version_name }}_${{ steps.version.outputs.commit_sha }}_debug.apk"
              mv "$apk" "app/build/outputs/apk/debug/${new_name}"
              echo "APK: ${new_name}"
            fi
          done

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tubular-debug-${{ steps.version.outputs.commit_sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ steps.version.outputs.commit_sha }}
          path: app/build/reports/
          retention-days: 3
        if: ${{ always() && !inputs.skip_lint }}

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ steps.version.outputs.branch_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ steps.version.outputs.commit_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.version.outputs.version_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Type** | Debug |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lint** | ${{ inputs.skip_lint && 'Skipped' || 'Enabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
